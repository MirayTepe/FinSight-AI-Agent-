version: '3.8'

services:
  finsight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight-platform
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - PORT=8501
      - SEC_USER_AGENT=${SEC_USER_AGENT:-FinSight Analyst contact@finsight.corp}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - LLM_MODE=${LLM_MODE:-gemini_only}
      - APP_ENV=production
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

